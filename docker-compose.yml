version: '3.8'

services:
  # --- Infrastructure ---
  
  api-gateway:
    build:
      context: ../Cyber-Suite-API-Gateway
      dockerfile: Dockerfile
    container_name: cyber-suite-api-gateway
    restart: unless-stopped
    ports:
      - "3000:3000"
    env_file:
      - ./env/api-gateway/.env
    networks:
      - cyber-net

  dashboard:
    build:
      context: ../Cyber-Suite-Dashboard
      dockerfile: Dockerfile.dev
    container_name: cyber-suite-dashboard
    restart: unless-stopped
    env_file:
      - ./env/dashboard/.env
    depends_on:
      - api-gateway
    networks:
      - cyber-net

  dashboard-nginx:
    image: nginx:alpine
    container_name: cyber-suite-dashboard-nginx
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf
      - ./certs:/etc/nginx/certs
    depends_on:
      - dashboard
    networks:
      - cyber-net

  # --- Misconfig Checker Services ---

  misconfig-checker:
    build: .
    container_name: misconfig-checker
    restart: unless-stopped
    ports:
      - "${PORT}:${PORT}"
    environment:
      - PORT=${PORT}
      - GOOGLE_API_KEY=${GOOGLE_API_KEY}
      - MSF_SERVER=metasploit
      - MSF_PORT=55553
      - MSF_PASSWORD=${MSF_PASSWORD:-msf}
      - MSF_SSL=true
    depends_on:
      - metasploit
    networks:
      - cyber-net

  metasploit:
    image: metasploitframework/metasploit-framework
    container_name: metasploit
    restart: unless-stopped
    ports:
      - "55553:55553"
    environment:
      - MSF_DATABASE_CONFIG=/usr/share/metasploit-framework/config/database.yml
    entrypoint: /usr/src/metasploit-framework/msfrpcd
    command: -P ${MSF_PASSWORD:-msf} -p 55553 -n -f -a 0.0.0.0
    networks:
      - cyber-net

networks:
  cyber-net:
    driver: bridge
